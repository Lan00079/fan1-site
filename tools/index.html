/* 引擎透明覆盖层中和器(同首页 index.html)：popunder 引擎的透明层 z>=2147483000
   会盖住横幅导致不可点，统一设 pointer-events:none 让点击落回广告 iframe；#vastFrame 内部不受影响 */
(function () {
  function neutralize() {
    try {
      document.querySelectorAll("div").forEach(function (el) {
        if (el.closest("#vastFrame")) return;
        var z = parseInt(el.style && el.style.zIndex || "0", 10);
        if (z >= 2147483000 && el.style.pointerEvents !== "none") el.style.pointerEvents = "none";
      });
    } catch (err) {}
  }
  document.addEventListener("DOMContentLoaded", function () {
    neutralize();
    new MutationObserver(neutralize).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["style"] });
  });
})();
</script>
