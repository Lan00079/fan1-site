<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小工具箱 · Tools</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --tx:#e8eaf0; --sub:#9aa3b2; --ac:#4f9cf9; --ok:#3fbf6f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--tx); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:48px 20px 80px; }
  header h1 { font-size:28px; letter-spacing:1px; }
  header p { color:var(--sub); margin-top:8px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:18px; margin-top:32px; }
  @media (max-width:520px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; transition:border-color .15s; }
  .card:hover { border-color:var(--ac); }
  .card .top { display:flex; align-items:center; gap:12px; }
  .card .icon { font-size:26px; }
  .card h2 { font-size:18px; }
  .card .tag { font-size:11px; color:var(--ok); border:1px solid var(--ok); border-radius:4px; padding:1px 7px; margin-left:8px; vertical-align:2px; }
  .card p.desc { color:var(--sub); font-size:13.5px; line-height:1.75; margin-top:12px; }
  .meta { display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; color:var(--sub); font-size:12px; font-family:Consolas,monospace; }
  .meta b { color:var(--tx); font-weight:600; }
  .row { display:flex; align-items:center; gap:12px; margin-top:18px; }
  a.btn { display:inline-block; background:var(--ac); color:#fff; text-decoration:none; padding:9px 22px; border-radius:8px; font-size:14px; }
  a.btn:hover { filter:brightness(1.12); }
  a.ghost { color:var(--sub); font-size:12px; text-decoration:none; border-bottom:1px dashed var(--sub); }
  details.hash { margin-top:12px; }
  details.hash summary { color:var(--sub); font-size:12px; cursor:pointer; }
  details.hash code { display:block; margin-top:6px; color:var(--sub); font-size:11px; word-break:break-all; }
  footer { margin-top:48px; color:var(--sub); font-size:12px; line-height:1.9; border-top:1px solid var(--line); padding-top:18px; }
  .empty { color:var(--sub); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔧 小工具箱</h1>
    <p>自用小工具发布页 · 全部免费 · 下载后请校验 SHA256</p>
  </header>

  <!-- ====== 工具列表: 加新工具 = 在 TOOLS 数组里加一个对象 ====== -->
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">暂无工具</div>

  <footer>
    所有工具按"AS IS"提供，仅供学习研究，使用产生的一切后果由使用者自行承担。<br>
    下载文件校验：CertUtil -hashfile 文件名 SHA256（Windows）· shasum -a 256 文件名（macOS/Linux）
  </footer>
</div>

<script>
const TOOLS = [
  {
    icon: "🚗",
    name: "tsd-mod",
    version: "1.0",
    date: "2026-10-12",
    size: "57.4 MB",
    file: "tsd-mod-v1.0.zip",
    sha256: "65fb547ff1463b1f692102872c5fa1321ba83f24c88a4ae101c487a3250fdedf",
    desc: "Steam 游戏《teach sister to drive Demo》本地化增强工具：自定义妹妹人格（逻辑版人设模板）+ 云端声音克隆（硅基流动 CosyVoice2，弱电脑零 GPU 可用）+ 可选自备 API key 的模型接口替换。全中文面板，一键应用/一键还原。",
    req: "Windows 10+ · 已安装 Steam 与游戏本体 · 硅基流动账号（语音合成用）",
    guide: "README.html"
  },
  /* 以后加新工具照抄上面这个结构即可,例:
  {
    icon: "🧪", name: "another-tool", version: "0.1", date: "2026-xx-xx",
    size: "1.2 MB", file: "another-tool.zip", sha256: "…",
    desc: "一句话说明", req: "运行条件", guide: ""
  },
  */
];

const grid = document.getElementById("grid");
if (!TOOLS.length) document.getElementById("empty").style.display = "";
for (const t of TOOLS) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="top"><span class="icon">${t.icon}</span><h2>${t.name}<span class="tag">v${t.version}</span></h2></div>
    <p class="desc">${t.desc}</p>
    <div class="meta"><span>📦 <b>${t.size}</b></span><span>📅 <b>${t.date}</b></span><span>⚙️ ${t.req}</span></div>
    <div class="row">
      <a class="btn" href="https://github.com/Lan00079/fan1-site/releases/download/tsd-mod-v1.0/${t.file}">⬇ 下载压缩包</a>
      <a class="ghost" href="https://ghproxy.net/https://github.com/Lan00079/fan1-site/releases/download/tsd-mod-v1.0/${t.file}" target="_blank">国内加速镜像 ↗</a>
      ${t.guide ? `<a class="ghost" href="${t.guide}" target="_blank">使用说明</a>` : ""}
    </div>
    <details class="hash"><summary>SHA256 校验值</summary><code>${t.sha256}</code></details>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
