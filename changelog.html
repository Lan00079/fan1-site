<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>更新日志 - fan1 汉化工具</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font:15px/1.9 "Segoe UI","Microsoft YaHei",sans-serif; color:#333; background:#f5f7fa; }
  .wrap { max-width:820px; margin:0 auto; padding:40px 20px; }
  h1 { font-size:26px; margin-bottom:8px; }
  .meta { color:#888; font-size:13px; margin-bottom:28px; }
  .item { background:#fff; border-radius:8px; padding:18px 22px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .item .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tag { display:inline-block; background:#e74c3c; color:#fff; font-size:.72em; padding:1px 9px; border-radius:10px; }
  .item b { font-size:1.05em; }
  .date { color:#888; font-size:.82em; }
  .body { color:#555; margin-top:8px; }
  a.back { color:#2c7fd9; text-decoration:none; }
  #empty { color:#888; }
</style>
</head>
<body>
<div class="wrap">
  <h1>更新日志</h1>
  <div class="meta">fan1.top · fan1 汉化工具 · 新汉化与新功能会在这里第一时间公布</div>
  <div id="list"><p id="empty">加载中…</p></div>
  <p style="margin-top:24px"><a class="back" href="index.html">← 返回首页</a></p>
</div>
<script>
(function () {
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    fetch("updates.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (list) {
            var box = document.getElementById("list");
            if (!Array.isArray(list) || !list.length) { box.innerHTML = '<p id="empty">暂无更新记录。</p>'; return; }
            box.innerHTML = "";
            list.forEach(function (u) {
                var d = document.createElement("div");
                d.className = "item";
                d.innerHTML =
                    '<div class="head"><span class="tag">' + esc(u.tag) + '</span><b>' + esc(u.title) + '</b><span class="date">' + esc(u.date) + '</span></div>' +
                    '<div class="body">' + esc(u.body) + '</div>';
                box.appendChild(d);
            });
        })
        .catch(function () { document.getElementById("list").innerHTML = '<p id="empty">更新记录加载失败，请稍后重试。</p>'; });
})();
</script>
</body>
</html>
